<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title"><title id="title">Alur Pengguna, Admin, reward dan perawatan pohon</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8" fill="#7c9180"/></marker></defs><rect width="1000" height="300" fill="white"/><text x="125" y="35.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#2d7650">PENGGUNA</text><rect x="10" y="70" width="230" height="150" rx="14" fill="#eef5e9" stroke="#c6d9bd" stroke-width="2"/><text x="125.0" y="101.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#234338">Kirim Sharing</text><text x="125.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f7565">Status menunggu</text><path d="M242 145L258 145" fill="none" stroke="#7c9180" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="375" y="35.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#9a6d2d">ADMIN</text><rect x="260" y="70" width="230" height="150" rx="14" fill="#fff5e6" stroke="#e2c99b" stroke-width="2"/><text x="375.0" y="101.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#234338">Review → ACC</text><text x="375.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f7565">Pertama dari menunggu</text><path d="M492 145L508 145" fill="none" stroke="#7c9180" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="625" y="35.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#327ea2">SISTEM</text><rect x="510" y="70" width="230" height="150" rx="14" fill="#eaf4fb" stroke="#bfd9e8" stroke-width="2"/><text x="625.0" y="101.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#234338">Reward → Storage</text><text x="625.0" y="160.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f7565">+6 Air · +4 Pupuk</text><text x="625.0" y="183.70000000000002" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f7565">+1 Buah</text><path d="M742 145L758 145" fill="none" stroke="#7c9180" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="875" y="35.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#2d7650">PENGGUNA</text><rect x="760" y="70" width="230" height="150" rx="14" fill="#eef5e9" stroke="#c6d9bd" stroke-width="2"/><text x="875.0" y="101.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#234338">Rawat pohon</text><text x="875.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f7565">Storage → pohon</text><text x="500" y="267.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#607464">Reward tidak langsung menaikkan level. Air dan Pupuk perlu digunakan.</text></svg>